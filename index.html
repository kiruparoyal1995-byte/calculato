<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #667eea;
            font-family: Arial, sans-serif;
        }
        
        .calculator {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            width: 300px;
        }
        
        .display {
            width: 100%;
            height: 80px;
            background: #222;
            color: white;
            border-radius: 5px;
            font-size: 2.5em;
            text-align: right;
            padding: 10px;
            margin-bottom: 20px;
            word-wrap: break-word;
            word-break: break-all;
            display: flex;
            align-items: center;
            justify-content: flex-end;
        }
        
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        
        button {
            padding: 20px;
            font-size: 1.5em;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        
        button:hover {
            opacity: 0.8;
        }
        
        .num {
            background: #f0f0f0;
        }
        
        .op {
            background: #667eea;
            color: white;
        }
        
        .equal {
            background: #48bb78;
            color: white;
            grid-column: span 2;
        }
        
        .clear {
            background: #f56565;
            color: white;
            grid-column: span 2;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <div class="display" id="display">0</div>
        <div class="buttons">
            <button class="clear" onclick="clr()">CLEAR</button>
            <button class="op" onclick="appendOp('/')">/</button>
            <button class="op" onclick="appendOp('')"></button>
            
            <button class="num" onclick="append('7')">7</button>
            <button class="num" onclick="append('8')">8</button>
            <button class="num" onclick="append('9')">9</button>
            <button class="op" onclick="appendOp('-')">-</button>
            
            <button class="num" onclick="append('4')">4</button>
            <button class="num" onclick="append('5')">5</button>
            <button class="num" onclick="append('6')">6</button>
            <button class="op" onclick="appendOp('+')">+</button>
            
            <button class="num" onclick="append('1')">1</button>
            <button class="num" onclick="append('2')">2</button>
            <button class="num" onclick="append('3')">3</button>
            <button class="num" onclick="append('.')">.</button>
            
            <button class="num" onclick="append('0')" style="grid-column: span 2;">0</button>
            <button class="equal" onclick="calc()">=</button>
        </div>
    </div>
    
    <script>
        let display = document.getElementById('display');
        let current = '0';
        let prev = '';
        let op = null;
        let newNum = false;
        
        function append(num) {
            if (newNum) {
                current = num;
                newNum = false;
            } else {
                current = current === '0' && num !== '.' ? num : current + num;
            }
            display.textContent = current;
        }
        
        function appendOp(operation) {
            if (op !== null && !newNum) {
                calc();
            }
            prev = current;
            op = operation;
            newNum = true;
        }
        
        function calc() {
            if (op === null || newNum) return;
            
            let result;
            let curr = parseFloat(current);
            let pr = parseFloat(prev);
            
            if (op === '+') result = pr + curr;
            else if (op === '-') result = pr - curr;
            else if (op === '*') result = pr * curr;
            else if (op === '/') result = curr === 0 ? 0 : pr / curr;
            
            current = result.toString();
            op = null;
            newNum = true;
            display.textContent = current;
        }
        
        function clr() {
            current = '0';
            prev = '';
            op = null;
            newNum = false;
            display.textContent = '0';
        }
    </script>
</body>
</html>
